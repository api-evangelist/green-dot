  - aid: green-dot:customer-care-api
    name: Green Dot Customer Care API
    description: >-
      Customer Care APIs create and manage customer support cases, customize UI
      for customer support, and enable customers to open support cases directly.
      Includes dispute automation endpoints so partners can manage disputes and
      care interactions programmatically within their own experience.
    humanURL: https://developer.greendot.com/embedded-finance/docs/customer-care
