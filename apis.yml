  - aid: green-dot:atm-retail-locators-api
    name: Green Dot ATM & Retail Locators API
    description: >-
      ATM & Retail Locator APIs locate nearby ATMs and Green Dot retail
      locations for cash deposits, withdrawals, and reload, returning
      geospatial location and store data. Used to surface the nearest network
      access points inside a partner application.
    humanURL: https://developer.greendot.com/embedded-finance/docs/retail-atm-locators
