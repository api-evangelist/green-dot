      - type: APIReference
        url: https://developer.greendot.com/embedded-finance/reference/getting-started-with-your-api
  - aid: green-dot:webhooks-api
    name: Green Dot Webhooks & Event Notifications
    description: >-
      Webhooks provide asynchronous event notifications to partner systems for
      account updates, transactions, and money-movement events. Documented with
      webhook samples, transaction webhook samples, and callback methods so
      partners can keep their systems synchronized with the BaaS platform in
      near real time rather than polling.
    humanURL: https://developer.greendot.com/embedded-finance/docs/webhooks-overview
    tags:
      - Webhook
      - Event
      - Notification
      - Banking as a Service
      - United States
    tags_raw:
