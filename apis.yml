aid: green-dot
url: https://raw.githubusercontent.com/api-evangelist/green-dot/refs/heads/main/apis.yml
name: Green Dot Corporation
kind: company
description: >-
  Green Dot Corporation (NYSE: GDOT) is a US fintech and bank holding company
  whose subsidiary Green Dot Bank is a chartered, FDIC-insured member bank. Its
  Green Dot Arc embedded-finance / Banking-as-a-Service (BaaS) platform lets
  brands and fintech partners embed banking and payments — account enrollment,
  KYC/KYB, DDA and prepaid accounts, ACH, transfers, bill pay, card issuing,
  cash deposits, mobile check deposit, disbursements, and P2P — through a REST
  API surface. The public developer portal (developer.greendot.com) documents
  300+ JSON/OAuth2 endpoints; production access, credentials, and the full
  Swagger definition are provisioned per-partner after a commercial onboarding.
