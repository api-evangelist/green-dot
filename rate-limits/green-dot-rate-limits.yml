specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Green Dot Corporation
providerId: green-dot
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Fintech
  - Banking-as-a-Service
  - Prepaid Cards
description: Green Dot does not publish rate-limit documentation for its banking-as-a-service /
  Arc API on its public website. Limits and SLAs for partner traffic are presumed to be defined in
  the program agreement, scoped per partner / BIN. Numeric values below are conservative placeholders
  pending direct documentation from Green Dot.
notes: No public rate-limit documentation found. Reconcile against partner program docs when access
  is granted.
sources:
  - https://www.greendot.com
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Partner / BIN issuing API
    scope: contract
    metric: varies
    limit: 'see partner program agreement'
    notes: Numeric limits are presumed to be set per partner program. Values not publicly documented.
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429 / 503 and respect
      Retry-After when present.
  - name: Contractual scoping
    description: Rate limits are presumed enforced at the partner / program level rather than via
      a public per-tier policy.
  - name: PCI / regulatory caution
    description: Card-issuing and movement-of-money endpoints typically have lower hard limits and
      stricter abuse / fraud monitoring than read-only endpoints.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
