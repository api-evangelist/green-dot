      - endpoint
principles:
  - name: Visibility
    description: Track program telemetry — accounts, transactions, ACH movement — through Green
      Dot's partner reporting and reconcile against monthly program invoices.
  - name: Allocation
    description: Tag accounts / cards / transactions with consuming product / sub-program so
      program-fee and interchange splits roll up to the right business owner.
  - name: Optimization
    description: Negotiate interchange share at scale; consolidate program-fee SKUs; route
      transactions through the lower-cost rail (ACH vs card) when possible.
  - name: Accountability
    description: Designate a fintech / BaaS owner accountable for the Green Dot program contract,
      monthly reconciliation, and chargeback / dispute handling.
